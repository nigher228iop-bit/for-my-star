<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #5a1f2e;
            --rose: #d9546f;
            --rose-dark: #b33a55;
            --rose-light: #f7c6cf;
            --cream: #fffaf7;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #fff0f5, #ffe4ef, #ffd6e7);
            font-family: 'Comfortaa', 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* ===== PIN SCREEN ===== */
        #pin-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #f3c9cf;
            background-image:
                linear-gradient(90deg, transparent 0 70px, rgba(201, 72, 102, 0.28) 70px 110px, transparent 110px 160px, rgba(201, 72, 102, 0.14) 160px 172px, transparent 172px),
                linear-gradient(0deg, transparent 0 70px, rgba(201, 72, 102, 0.28) 70px 110px, transparent 110px 160px, rgba(201, 72, 102, 0.14) 160px 172px, transparent 172px),
                linear-gradient(90deg, transparent 0 30px, rgba(255, 255, 255, 0.25) 30px 33px, transparent 33px),
                linear-gradient(0deg, transparent 0 30px, rgba(255, 255, 255, 0.25) 30px 33px, transparent 33px);
            background-size: 220px 220px;
            transition: opacity 0.9s ease, transform 0.9s ease;
        }

        #pin-screen.unlocked {
            opacity: 0;
            transform: scale(1.08);
            pointer-events: none;
        }

        .bg-heart {
            position: absolute;
            pointer-events: none;
            color: #c9486a;
            opacity: 0.15;
            animation: breathe ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0%   { opacity: 0.12; transform: translateY(0) scale(0.85) rotate(-8deg); }
            100% { opacity: 0.55; transform: translateY(-14px) scale(1.05) rotate(8deg); }
        }

        .pin-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        .pin-title {
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 2.3rem;
            color: #b8203f;
            letter-spacing: 1px;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.7), 0 4px 0 rgba(90, 31, 46, 0.2);
            margin-bottom: 1rem;
        }

        .lock {
            width: 58px;
            height: 66px;
            margin-bottom: 0.3rem;
            overflow: visible;
            filter: drop-shadow(3px 3px 0 rgba(90, 31, 46, 0.25));
            animation: lockFloat 3s ease-in-out infinite;
        }

        .lock .shackle {
            transform-box: view-box;
            transform-origin: 46px 22px;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .lock.open .shackle { transform: translateY(-8px) rotate(32deg); }
        .lock.shake { animation: shake 0.45s; }

        @keyframes lockFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .pin-boxes {
            display: flex;
            gap: 12px;
            margin-bottom: 1rem;
        }

        .pin-box {
            width: 58px;
            height: 58px;
            background: var(--cream);
            border: 3px solid var(--ink);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 3px 3px 0 rgba(90, 31, 46, 0.25);
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            color: var(--rose-dark);
            transition: background 0.2s;
        }

        .pin-box svg { width: 30px; height: 30px; }
        .pin-box.filled { background: #ffe6ec; animation: pop 0.25s ease; }
        .pin-box.active { border-color: var(--rose); animation: activePulse 1.2s ease-in-out infinite; }

        @keyframes activePulse {
            0%, 100% { box-shadow: 3px 3px 0 rgba(90, 31, 46, 0.25), 0 0 0 0 rgba(217, 84, 111, 0.5); }
            50% { box-shadow: 3px 3px 0 rgba(90, 31, 46, 0.25), 0 0 0 6px rgba(217, 84, 111, 0); }
        }
        .pin-box.error { background: #ffd0d6; animation: shake 0.45s; }

        @keyframes pop {
            0% { transform: scale(0.8); }
            60% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        .pin-hint {
            font-size: 0.9rem;
            font-weight: 700;
            color: #7a2840;
            background: rgba(255, 250, 247, 0.85);
            border: 2px solid var(--ink);
            border-radius: 999px;
            padding: 0.4rem 1rem;
            box-shadow: 2px 2px 0 rgba(90, 31, 46, 0.2);
            margin-bottom: 1.4rem;
            text-align: center;
        }

        .pin-hint.wiggle { animation: wiggle 0.6s; }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0) scale(1); }
            25% { transform: rotate(-4deg) scale(1.06); }
            50% { transform: rotate(4deg) scale(1.06); }
            75% { transform: rotate(-2deg) scale(1.03); }
        }

        .pin-keypad {
            background: var(--cream);
            border: 3px solid var(--ink);
            border-radius: 26px;
            padding: 18px;
            display: grid;
            grid-template-columns: repeat(3, 66px);
            gap: 12px;
            box-shadow: 5px 6px 0 rgba(90, 31, 46, 0.25);
        }

        .pin-key {
            height: 60px;
            border-radius: 14px;
            border: 2.5px solid var(--ink);
            background: linear-gradient(180deg, #e46b84, var(--rose-dark));
            box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.15), 0 3px 0 var(--ink);
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .pin-key:active, .pin-key.pressed {
            transform: translateY(3px);
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.15), 0 0 0 var(--ink);
        }

        .pin-key.del { font-size: 1rem; letter-spacing: 1px; }
        .pin-key.heart-key { background: linear-gradient(180deg, #fff0f4, #ffd3de); color: var(--rose-dark); }
        .pin-key.heart-key svg { width: 26px; height: 26px; }

        /* ===== POPUPS ===== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(190, 50, 85, 0.45);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }

        .overlay.show { opacity: 1; pointer-events: auto; }

        .popup {
            position: relative;
            width: min(300px, 86vw);
            background: var(--cream);
            border: 3px solid var(--ink);
            border-radius: 24px;
            box-shadow: 6px 7px 0 rgba(90, 31, 46, 0.3);
            padding: 1.6rem 1.4rem 1.4rem;
            text-align: center;
            transform: scale(0.6);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .overlay.show .popup { transform: scale(1); }
        .overlay.show .popup.wobble { animation: wobble 0.6s 0.3s; }

        @keyframes wobble {
            0%, 100% { transform: rotate(0) scale(1); }
            25% { transform: rotate(-3deg) scale(1); }
            50% { transform: rotate(3deg) scale(1); }
            75% { transform: rotate(-1.5deg) scale(1); }
        }

        .popup h2 {
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 1.6rem;
            color: #b8203f;
            margin-bottom: 0.4rem;
        }

        .kitty { width: 160px; height: 140px; margin: 0 auto 0.4rem; display: block; object-fit: contain; mix-blend-mode: multiply; }
        .kitty.sad { animation: sniff 1.6s ease-in-out infinite; }
        .kitty.happy { animation: bounce 0.9s ease-in-out infinite; }

        @keyframes sniff {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(3px) scaleY(0.97); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }


        .popup p {
            font-size: 0.95rem;
            color: var(--ink);
            margin-bottom: 1.1rem;
            font-weight: 600;
        }

        .popup-btn {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 1.05rem;
            color: #fff;
            background: linear-gradient(180deg, #e46b84, var(--rose-dark));
            border: 2.5px solid var(--ink);
            border-radius: 999px;
            padding: 0.55rem 2.4rem;
            box-shadow: 0 3px 0 var(--ink);
            cursor: pointer;
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .popup-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }

        .burst {
            position: absolute;
            left: 50%;
            top: 40%;
            pointer-events: none;
            color: #e0517a;
            animation: burst 1.3s ease-out forwards;
        }

        @keyframes burst {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); opacity: 0; }
        }

        /* ===== MAIN CONTENT ===== */
        .container { text-align: center; z-index: 10; padding: 2rem; }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #d63384;
            text-shadow: 0 2px 10px rgba(214, 51, 132, 0.2);
            margin-bottom: 1rem;
        }

        .container p { font-size: 1.2rem; color: #c2185b; opacity: 0.8; }

        .hearts-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            top: -60px;
            opacity: 0;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { opacity: 0; transform: translateY(0) rotate(0deg) scale(0.5); }
            10% { opacity: 1; }
            50% { opacity: 0.8; }
            90% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(110vh) rotate(720deg) scale(0.3); }
        }

        .glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 105, 180, 0.15), transparent 70%);
            pointer-events: none;
            z-index: 2;
        }

        .glow-1 { top: 10%; left: 20%; animation: gfloat 8s ease-in-out infinite; }
        .glow-2 { top: 60%; right: 15%; animation: gfloat 10s ease-in-out infinite reverse; }
        .glow-3 { bottom: 10%; left: 50%; animation: gfloat 12s ease-in-out infinite; }

        @keyframes gfloat {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(30px, -20px); }
            50% { transform: translate(-20px, 30px); }
            75% { transform: translate(20px, 20px); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .container p { font-size: 1rem; }
            .pin-title { font-size: 1.9rem; }
            .pin-box { width: 48px; height: 48px; font-size: 1.5rem; }
            .pin-keypad { grid-template-columns: repeat(3, 60px); gap: 10px; padding: 14px; }
            .pin-key { height: 54px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div id="pin-screen">
        <div class="pin-content">
            <svg class="lock" id="lock" viewBox="0 0 64 72" aria-hidden="true">
                <path class="shackle" d="M18,32 V22 a14,14 0 0 1 28,0 V32" fill="none" stroke="#5a1f2e" stroke-width="6" stroke-linecap="round"/>
                <rect x="8" y="30" width="48" height="38" rx="11" fill="#e46b84" stroke="#5a1f2e" stroke-width="3"/>
                <path transform="translate(20 37)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#fffaf7"/>
            </svg>
            <div class="pin-title">Введи код</div>
            <div class="pin-boxes" id="pin-boxes"></div>
            <div class="pin-hint" id="pin-hint">Какая та дата связанная с нами, бебебе</div>
            <div class="pin-keypad" id="pin-keypad">
                <div class="pin-key" data-num="1">1</div>
                <div class="pin-key" data-num="2">2</div>
                <div class="pin-key" data-num="3">3</div>
                <div class="pin-key" data-num="4">4</div>
                <div class="pin-key" data-num="5">5</div>
                <div class="pin-key" data-num="6">6</div>
                <div class="pin-key" data-num="7">7</div>
                <div class="pin-key" data-num="8">8</div>
                <div class="pin-key" data-num="9">9</div>
                <div class="pin-key heart-key" id="pin-heart"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="currentColor"/></svg></div>
                <div class="pin-key" data-num="0">0</div>
                <div class="pin-key del" id="pin-del">DEL</div>
            </div>
        </div>
    </div>

    <div class="overlay" id="popup-wrong">
        <div class="popup wobble">
            <h2>Неверна!</h2>
            <img class="kitty sad" src="sad.png" alt="">
            <p id="wrong-text">Я буду очен грусным есле низнаеш када мы начале встричаца!((</p>
            <button class="popup-btn" id="btn-retry">ищьо раз</button>
        </div>
    </div>

    <div class="overlay" id="popup-right">
        <div class="popup" id="popup-right-box">
            <h2>Доступ аткрыт тебе</h2>
            <img class="kitty happy" src="love.png" alt="">
            <p>Ты справилась, мая люпимасть ❤️</p>
            <button class="popup-btn" id="btn-enter">Вайти</button>
        </div>
    </div>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>
    <div class="hearts-container" id="hearts"></div>
    <div class="container">
        <h1>Дашенька 💗</h1>
        <p>Скоро тут будет кое-что особенное для тебя...</p>
    </div>

    <script>
        (function () {
            var CODE = '1909';
            var HEART_PATH = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
            var EMPTY_HEART = '<svg viewBox="0 0 24 24"><path d="' + HEART_PATH + '" fill="#f7c6cf"/></svg>';

            var pinScreen = document.getElementById('pin-screen');
            var boxesEl = document.getElementById('pin-boxes');
            var popupWrong = document.getElementById('popup-wrong');
            var popupRight = document.getElementById('popup-right');
            var wrongText = document.getElementById('wrong-text');
            var entered = '';
            var busy = false;
            var attempts = 0;

            for (var i = 0; i < 4; i++) {
                var b = document.createElement('div');
                b.className = 'pin-box';
                boxesEl.appendChild(b);
            }
            var boxes = boxesEl.children;

            function render() {
                for (var i = 0; i < 4; i++) {
                    var filled = i < entered.length;
                    var wasFilled = boxes[i].classList.contains('filled');
                    boxes[i].className = 'pin-box' + (filled ? ' filled' : '') + (i === entered.length && !busy ? ' active' : '');
                    if (filled && !wasFilled) {
                        void boxes[i].offsetWidth;
                    }
                    boxes[i].innerHTML = filled ? entered[i] : EMPTY_HEART;
                }
            }

            function press(num) {
                if (busy || entered.length >= 4) return;
                entered += num;
                render();
                if (entered.length === 4) {
                    busy = true;
                    setTimeout(check, 350);
                }
            }

            function del() {
                if (busy || !entered.length) return;
                entered = entered.slice(0, -1);
                render();
            }

            var wrongLines = ['Я буду очен грусным есле низнаеш када мы начале встричаца!(('];

            var lock = document.getElementById('lock');
            var hint = document.getElementById('pin-hint');

            function replay(el, cls) {
                el.classList.remove(cls);
                void el.getBoundingClientRect();
                el.classList.add(cls);
            }

            function check() {
                if (entered === CODE) {
                    lock.classList.add('open');
                    setTimeout(function () {
                        popupRight.classList.add('show');
                        burstHearts();
                    }, 550);
                } else {
                    attempts++;
                    replay(lock, 'shake');
                    for (var i = 0; i < 4; i++) boxes[i].classList.add('error');
                    wrongText.textContent = wrongLines[(attempts - 1) % wrongLines.length];
                    setTimeout(function () { popupWrong.classList.add('show'); }, 450);
                }
            }

            function burstHearts() {
                var box = document.getElementById('popup-right-box');
                for (var i = 0; i < 18; i++) {
                    var h = document.createElement('div');
                    h.className = 'burst';
                    var angle = Math.random() * Math.PI * 2;
                    var dist = 110 + Math.random() * 90;
                    h.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                    h.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                    h.style.setProperty('--rot', (Math.random() * 80 - 40) + 'deg');
                    h.style.animationDelay = (Math.random() * 0.25) + 's';
                    var s = 14 + Math.random() * 14;
                    h.innerHTML = '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '"><path d="' + HEART_PATH + '" fill="currentColor"/></svg>';
                    box.appendChild(h);
                    (function (el) { setTimeout(function () { el.remove(); }, 1700); })(h);
                }
            }

            document.getElementById('pin-keypad').addEventListener('click', function (e) {
                var key = e.target.closest('.pin-key');
                if (!key) return;
                if (key.id === 'pin-del') return del();
                if (key.id === 'pin-heart') return replay(hint, 'wiggle');
                var n = key.getAttribute('data-num');
                if (n !== null) press(n);
            });

            document.addEventListener('keydown', function (e) {
                if (pinScreen.classList.contains('unlocked')) return;
                if (popupWrong.classList.contains('show') && (e.key === 'Enter' || e.key === ' ')) {
                    e.preventDefault();
                    return retry();
                }
                if (popupRight.classList.contains('show') && (e.key === 'Enter' || e.key === ' ')) {
                    e.preventDefault();
                    return enter();
                }
                if (e.key >= '0' && e.key <= '9') {
                    var k = document.querySelector('.pin-key[data-num="' + e.key + '"]');
                    if (k) { k.classList.add('pressed'); setTimeout(function () { k.classList.remove('pressed'); }, 100); }
                    press(e.key);
                } else if (e.key === 'Backspace') {
                    del();
                }
            });

            function retry() {
                popupWrong.classList.remove('show');
                entered = '';
                busy = false;
                render();
            }

            function enter() {
                popupRight.classList.remove('show');
                pinScreen.classList.add('unlocked');
                setTimeout(function () { pinScreen.style.display = 'none'; }, 950);
                startHearts();
            }

            document.getElementById('btn-retry').addEventListener('click', retry);
            document.getElementById('btn-enter').addEventListener('click', enter);

            var bgCount = window.innerWidth < 600 ? 14 : 22;
            for (var j = 0; j < bgCount; j++) {
                var bh = document.createElement('div');
                bh.className = 'bg-heart';
                var size = 14 + Math.random() * 26;
                bh.innerHTML = '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '"><path d="' + HEART_PATH + '" fill="currentColor"/></svg>';
                bh.style.left = (Math.random() * 94 + 2) + '%';
                bh.style.top = (Math.random() * 92 + 2) + '%';
                bh.style.animationDuration = (4 + Math.random() * 5) + 's';
                bh.style.animationDelay = (-Math.random() * 8) + 's';
                pinScreen.insertBefore(bh, pinScreen.firstChild);
            }

            render();

            var heartsContainer = document.getElementById('hearts');
            var heartSymbols = ['\u{1F497}', '\u{1F495}', '\u{1F493}'];
            var pinkColors = ['#ff69b4', '#ff1493', '#db7093', '#ffb6c1', '#ff85a2', '#ffc0cb', '#f8a4c8', '#e791b8'];
            var heartsStarted = false;

            function createHeart() {
                var heart = document.createElement('div');
                heart.className = 'heart';
                if (Math.random() > 0.4) {
                    heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                    heart.style.fontSize = (Math.random() * 20 + 14) + 'px';
                } else {
                    var size = Math.random() * 16 + 10;
                    var color = pinkColors[Math.floor(Math.random() * pinkColors.length)];
                    heart.innerHTML = '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '"><path d="' + HEART_PATH + '" fill="' + color + '"/></svg>';
                }
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
                heartsContainer.appendChild(heart);
                setTimeout(function () { heart.remove(); }, 9000);
            }

            function startHearts() {
                if (heartsStarted) return;
                heartsStarted = true;
                for (var i = 0; i < 15; i++) setTimeout(createHeart, Math.random() * 2000);
                setInterval(createHeart, 300);
            }
        })();
    </script>
</body>
</html>
