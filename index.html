<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 Для тебя</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #fff0f5, #ffe4ef, #ffd6e7);
            font-family: 'Comfortaa', 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #d63384;
            text-shadow: 0 2px 10px rgba(214, 51, 132, 0.2);
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            color: #c2185b;
            opacity: 0.8;
        }

        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            top: -60px;
            opacity: 0;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                opacity: 0;
                transform: translateY(0) rotate(0deg) scale(0.5);
            }
            10% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg) scale(0.3);
            }
        }

        .glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 105, 180, 0.15), transparent 70%);
            pointer-events: none;
            z-index: 2;
        }

        .glow-1 { top: 10%; left: 20%; animation: float 8s ease-in-out infinite; }
        .glow-2 { top: 60%; right: 15%; animation: float 10s ease-in-out infinite reverse; }
        .glow-3 { bottom: 10%; left: 50%; animation: float 12s ease-in-out infinite; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(30px, -20px); }
            50% { transform: translate(-20px, 30px); }
            75% { transform: translate(20px, 20px); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <div class="hearts-container" id="hearts"></div>

    <div class="container">
        <h1>Дашенька 💗</h1>
        <p>Скоро тут будет кое-что особенное для тебя...</p>
    </div>

    <script>
        const heartsContainer = document.getElementById('hearts');
        const heartSymbols = ['💗', '💕', '💓'];
        const colors = ['#ff69b4', '#ff1493', '#db7093', '#ffb6c1', '#ff85a2', '#ffc0cb', '#f8a4c8', '#e791b8'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');

            const useEmoji = Math.random() > 0.4;

            if (useEmoji) {
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.fontSize = (Math.random() * 20 + 14) + 'px';
            } else {
                const size = Math.random() * 16 + 10;
                const color = colors[Math.floor(Math.random() * colors.length)];
                heart.innerHTML = '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="' + color + '"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
                heart.style.opacity = String(Math.random() * 0.5 + 0.3);
            }

            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
            heart.style.animationDelay = (Math.random() * 0.5) + 's';

            heartsContainer.appendChild(heart);

            setTimeout(function() { heart.remove(); }, 9000);
        }

        for (var i = 0; i < 15; i++) {
            setTimeout(createHeart, Math.random() * 2000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
